<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACOS 규격 지연 대응 공수 협의</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a briefing board. One sticky bar holds the 기존/변경 switch; the schedule and the effort chart below both answer to it. */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --wash: #f4f2f6;
  --ink: #17141a;
  --ink-2: #5a5461;
  --ink-3: #8a8391;
  --line: #ddd8e2;
  --plan: #b7b1be;        /* 기존 계획 */
  --plan-wash: #eceaef;
  --accent: #e6007e;      /* 변경 · 추가 (LGU+ magenta) */
  --accent-deep: #a3005a;
  --accent-wash: #fde9f3;
  --mark: #ffe566;        /* 형광펜 */
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --ease: cubic-bezier(.6, .05, .2, 1);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--wash); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ── top bar ── */
.bar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
.brand span { color: var(--ink-3); font-weight: 500; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; margin-right: auto; }
.bar-in .brand { margin-right: auto; }
.bar-in .nav { order: 3; flex-basis: 100%; margin-right: 0; } /* 전체 화면 · 편집 버튼을 상단 첫 줄 오른쪽에 두고 메뉴는 아래 줄 */
.bar-in #ed-toggle, .bar-in #fs { order: 2; }
.nav a { padding: 6px 10px; border-radius: 4px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.nav a:hover { background: var(--wash); color: var(--ink); }
.nav a.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); border-radius: 0; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--plan-wash); border-radius: 999px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: color .3s; }
.seg button small { font-weight: 500; font-size: 11.5px; opacity: .8; margin-left: 4px; }
.seg button[aria-pressed="true"] { color: #fff; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--ink); transition: transform .45s var(--ease), background .45s; }
[data-mode="changed"] .seg .thumb { transform: translateX(100%); background: var(--accent); }

/* ── sheets ── */
main { max-width: 1400px; margin: 0 auto; padding: 20px 104px 20px 24px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px 36px 26px; }
.sheet-no { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 10px; }
.sheet-no b { color: var(--ink); }
.sheet h2 { font-size: 23px; line-height: 1.38; font-weight: 700; letter-spacing: -.01em; max-width: 44em; }
.lede { margin-top: 6px; color: var(--ink-2); max-width: 60em; font-size: 14.5px; }
mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }

/* ── 1 summary ── */
.hero h1 { font-size: 29px; line-height: 1.32; font-weight: 700; letter-spacing: -.02em; max-width: 25em; }
.hero .ask { margin-top: 8px; font-size: 16px; font-weight: 500; }
.scale { margin-top: 20px; }
.scale-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.scale-top .cap { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.scale-top .tot { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.scale-top .tot small { font-size: 18px; font-weight: 600; margin-left: 4px; }
.scale-bar { margin-top: 8px; display: flex; gap: 3px; height: 44px; }
.scale-bar div { display: flex; align-items: center; padding: 0 14px; color: #fff; font-weight: 700; font-size: 19px; min-width: 0; white-space: nowrap; }
.scale-bar .s0 { background: var(--ink-2); border-radius: 5px 0 0 5px; }
.scale-bar .s1 { background: var(--accent-deep); }
.scale-bar .s2 { background: var(--accent); border-radius: 0 5px 5px 0; }
.scale-bar div { overflow: hidden; }
.scale-cap { display: flex; gap: 3px; margin-top: 8px; font-size: 13.5px; }
.scale-cap div { min-width: 0; }
.scale-cap b { display: block; }
.scale-cap span { color: var(--ink-2); }
.chain { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 2px solid var(--ink); }
.chain li { list-style: none; padding: 12px 22px 2px 0; position: relative; }
.chain li + li { padding-left: 22px; border-left: 1px solid var(--line); }
.chain { padding: 0; margin-bottom: 0; }
.chain .tag { font-size: 12.5px; font-weight: 700; color: var(--accent-deep); }
.chain h3 { font-size: 16.5px; line-height: 1.4; margin: 4px 0 6px; }
.chain p { font-size: 14px; color: var(--ink-2); }
.two { margin-top: 34px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; }
.two h3 { font-size: 15px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.principle .lead { margin: 12px 0 4px; font-weight: 600; font-size: 15.5px; }
.principle dl { margin: 0; }
.principle .r { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.principle dt { font-weight: 600; }
.principle dd { margin: 0; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: 1fr 1fr; }
.fact { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 10px 12px 0; cursor: pointer; display: block; }
.fact:nth-child(odd) { border-right: 1px solid var(--line); }
.fact:nth-child(even) { padding-left: 16px; }
.fact .v { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.fact .l { display: block; font-size: 13.5px; font-weight: 600; margin-top: 2px; }
.fact .d { display: block; font-size: 12.5px; color: var(--ink-2); }
.fact .go { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--accent-deep); text-decoration: underline; text-underline-offset: 3px; }
.fact:hover .v { color: var(--accent-deep); }
.frame { margin-top: 16px; background: var(--ink); color: #fff; border-radius: 5px; padding: 13px 22px 15px; }
.frame h3 { font-size: 19px; line-height: 1.4; }
.frame p { font-size: 15px; margin-top: 4px; color: #e4dfe9; }
.chain .more, .side .more, .stat3 .more, .panel .more { margin-top: 8px; display: inline-block; color: var(--accent-deep); font-weight: 600; font-size: 12.5px; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.stat3 { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr 1.9fr; border-top: 1px solid var(--ink); }
.stat3 > div { padding: 12px 22px 0 0; min-width: 0; }
.stat3 > div + div { padding-left: 22px; border-left: 1px solid var(--line); }
.stat3 h3 { font-size: 15px; }
.stat3 p { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }
.stat3 .facts { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.stat3 .facts dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat3 .facts dd { margin: 0; color: var(--ink-2); }
.prop-row { margin-top: 18px; display: grid; grid-template-columns: 2.1fr 1fr; gap: 36px; align-items: start; }
.prop-row > * { min-width: 0; }
.prop h3 { font-size: 15px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.prop ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; }
.prop li { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 10px 0 0; }
.prop .n { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
.prop b { font-size: 15px; }
.prop p { grid-column: 2; font-size: 13.5px; color: var(--ink-2); }
.side .principle { margin-top: 16px; }
.side .principle .r { padding: 5px 0; font-size: 13px; }
.side .principle .lead { margin: 8px 0 2px; font-size: 14.5px; }
.chart .notes { margin-top: 12px; }
.shared { margin-top: 0; padding: 12px 16px; background: var(--wash); border-radius: 4px; font-size: 13.5px; color: var(--ink-2); }

/* ── 2 gantt ── */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 8px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 22px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.k-base { background: var(--plan); } .k-dvt { background: var(--ink); } .k-add { background: var(--accent); }
.k-e2e { background: var(--paper); border: 1.5px solid var(--ink); } .k-ghost { border: 1.5px dashed var(--ink-3); }
.scroll { overflow-x: auto; }
.gantt { min-width: 900px; --lab: 132px; }
.g-head, .g-row { display: grid; grid-template-columns: var(--lab) 1fr; }
.g-overlay { padding-top: 26px; }
.g-months { display: grid; grid-template-columns: repeat(var(--n), 1fr); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.g-months span { padding: 6px 0 6px 8px; border-left: 1px solid var(--line); }
.g-months .yr { color: var(--ink-3); font-weight: 500; margin-right: 4px; }
.g-months .hot { color: var(--ink); background: var(--wash); }
.g-row { border-top: 1px solid var(--line); }
.g-lab { padding: 22px 12px 0 0; font-weight: 700; font-size: 14px; line-height: 1.35; }
.g-lab small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; }
.g-track { position: relative; height: 92px; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / var(--n))); }
.g-bar { position: absolute; height: 26px; border: 0; border-radius: 4px; padding: 0 9px; font-size: 12.5px; font-weight: 600; line-height: 26px; white-space: nowrap; overflow: hidden; text-align: left; left: var(--cl); width: var(--cw); transition: left 1s var(--ease), width 1s var(--ease), opacity .5s, transform .6s var(--ease), background .6s; transition-delay: calc(var(--o, 0) * 140ms); transform-origin: left center; }
.g-bar.t0 { top: 22px; } .g-bar.t1 { top: 54px; }
[data-mode="plan"] .g-bar { left: var(--pl); width: var(--pw); }
.g-bar.base { background: var(--plan); color: var(--ink); }
.g-bar.base.open { border-radius: 0 4px 4px 0; -webkit-mask-image: linear-gradient(to right, transparent, #000 34px); mask-image: linear-gradient(to right, transparent, #000 34px); padding-left: 40px; }
.g-bar.dvt { background: var(--ink); color: #fff; z-index: 2; }
.g-bar.e2e { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.g-bar.add { background: var(--accent); color: #fff; z-index: 1; }
[data-mode="plan"] .g-bar.add { opacity: 0; transform: scaleX(.15); pointer-events: none; }
button.g-bar { cursor: pointer; }
button.g-bar:hover { filter: brightness(1.15); }
.g-bar .lp, .g-bar .lc { display: block; }
[data-mode="plan"] .g-bar .lc, [data-mode="changed"] .g-bar .lp { display: none; }
.g-ghost { position: absolute; top: 17px; height: 36px; border: 1.5px dashed var(--ink-3); border-radius: 6px; opacity: 0; transition: opacity .5s .5s; pointer-events: none; }
.g-ghost span { position: absolute; left: 0; top: -17px; font-size: 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
[data-mode="changed"] .g-ghost { opacity: 1; }
.g-marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent); opacity: 0; transition: opacity .4s; z-index: 3; pointer-events: none; }
[data-mode="changed"] .g-marker { opacity: 1; }
.g-overlay { position: relative; }
.g-flag { position: absolute; top: 0; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 3px; white-space: nowrap; opacity: 0; transition: opacity .4s; z-index: 4; }
[data-mode="changed"] .g-flag { opacity: 1; }
.g-strip .g-track { height: auto; min-height: 84px; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / var(--n))); }
.g-strip .g-lab { padding-top: 16px; }
.s-block { position: absolute; top: 10px; bottom: 10px; border-radius: 5px; padding: 8px 11px; font-size: 12.5px; line-height: 1.4; transition: background .6s, color .6s; background: var(--plan-wash); overflow: hidden; }
[data-mode="changed"] .s-block { background: var(--accent-wash); }
.s-block b { display: block; font-size: 13px; }
.s-block .mm { font-weight: 600; }
.s-block .up { color: var(--accent-deep); font-weight: 700; }
.s-block .sp, .s-block .sc { display: block; }
[data-mode="plan"] .s-block .sc, [data-mode="changed"] .s-block .sp { display: none; }
.steps { margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.step { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 5px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; }
.step:hover { border-color: var(--ink); }
.step .n { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.step b { font-size: 14px; line-height: 1.4; }
.step .sb { grid-column: 2; font-size: 12.5px; color: var(--ink-2); }
.step:last-child { background: var(--ink); border-color: var(--ink); color: #fff; }
.step:last-child .sb { color: #d6d1db; }
.bridge { margin-top: 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.bridge::before { content: ""; width: 22px; height: 2px; background: var(--ink); }

/* ── 3 effort ── */
.eff { margin-top: 16px; display: grid; grid-template-columns: 1.12fr 1fr; gap: 44px; align-items: start; }
.chart { position: relative; }
.c-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
.c-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.plot { position: relative; height: 270px; margin-left: 30px; border-bottom: 1.5px solid var(--ink); }
.plot .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.plot .grid span { position: absolute; left: -30px; top: -9px; width: 24px; text-align: right; font-size: 11.5px; color: var(--ink-3); }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.col { position: relative; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
.col:hover { background: rgba(23, 20, 26, .035); }
.b { position: relative; width: 31%; max-width: 62px; border-radius: 4px 4px 0 0; transition: height .9s var(--ease); }
.b .val { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font-size: 12.5px; font-weight: 600; padding-bottom: 3px; white-space: nowrap; transition: opacity .4s; }
.b.p { background: var(--plan); height: var(--ph); }
.b.p .val { color: var(--ink-2); }
.b.a { background: var(--ink); height: var(--ah); transition-delay: calc(var(--i) * 110ms + 150ms); overflow: visible; }
.b.a .over { position: absolute; left: 0; right: 0; top: 0; height: var(--oh); background: var(--accent); border-radius: 4px 4px 0 0; }
.b.a .val { font-weight: 700; }
[data-mode="plan"] .b.a { height: 0; }
[data-mode="plan"] .b.a .val, [data-mode="plan"] .chip { opacity: 0; }
.chip { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--top) + 30px); background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; transition: opacity .4s .9s; }
.chip.neg { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--plan); }
.xlab { margin-left: 30px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: 13.5px; font-weight: 700; padding-top: 6px; }
.brackets { margin-left: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.brk { border-top: 2px solid var(--ink); padding: 8px 4px 0; text-align: center; font-size: 13px; line-height: 1.45; }
.brk b { display: block; font-size: 13.5px; }
.brk .sp, .brk .sc { display: block; }
.brk .big { font-size: 21px; font-weight: 700; color: var(--accent-deep); letter-spacing: -.01em; }
[data-mode="plan"] .brk .sc, [data-mode="changed"] .brk .sp { display: none; }
[data-mode="plan"] .brk .big { color: var(--ink); }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: #fff; border-radius: 5px; padding: 9px 11px; font-size: 12px; line-height: 1.5; min-width: 190px; opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip b { font-size: 12.5px; }
.tip table { border-collapse: collapse; width: 100%; margin-top: 3px; }
.tip td { padding: 0; } .tip td + td { text-align: right; padding-left: 14px; }
.tip .mut { color: #c9c3cf; }
.side h3 { font-size: 15px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.sum-eq { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.sum-eq small { font-size: 12px; font-weight: 500; color: var(--ink-2); display: block; letter-spacing: 0; }
.sum-eq .t { color: var(--accent-deep); }
.sum-eq div { line-height: 1.25; }
.split { margin-top: 16px; }
.split-bar { display: flex; gap: 3px; height: 34px; margin-top: 10px; }
.split-bar div { display: flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; white-space: nowrap; border-radius: 3px; }
.split-bar .x1 { background: var(--ink); color: #fff; }
.split-bar .x2 { background: var(--plan); color: var(--ink); }
.split-cap { display: flex; gap: 3px; font-size: 12.5px; font-weight: 600; margin-top: 5px; }
.split p { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .c { text-align: center; white-space: nowrap; }
.tbl tr.tot td, .tbl tr.tot th { font-weight: 700; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.tbl tr.sub td { color: var(--ink-2); font-size: 13px; }
.tbl tr.sub td:first-child { padding-left: 22px; }
.tbl .pos { color: var(--accent-deep); font-weight: 600; }
.tbl .nw { white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--wash); }
.tbl .more, .sheet > p > .more { color: var(--accent-deep); font-weight: 600; font-size: 12px; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.mbtn { border: 0; background: none; padding: 0; font-weight: 600; font-size: 12.5px; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.mbtn:hover { color: var(--accent-deep); }
.eff-table { margin-top: 26px; }
.evg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 8px; }
.evg.one { grid-template-columns: 1fr; }
.evf { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.evf a { display: block; color: inherit; text-decoration: none; }

.evl { display: inline-block; margin: 0 6px 2px 0; padding: 1px 7px; border-radius: 10px; background: var(--wash); color: var(--accent-deep); font-size: 11.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }

/* 첫 장 한 장 구성 */

/* ── appendix ── */

.apx { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 22px 36px 26px; }

.flow b { font-size: 21px; display: block; line-height: 1.3; }
.scope-bar { display: flex; gap: 3px; height: 30px; margin: 8px 0; }
.scope-bar div { display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 13px; font-weight: 700; border-radius: 3px; white-space: nowrap; }

/* ── paging ── */
.page { display: none; }
.page.on { display: block; animation: pagein .4s var(--ease); }
body.staged { overflow: hidden; height: 100vh; height: 100dvh; }
body.staged main { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; max-width: none; margin: 0; padding: 0; transform-origin: 0 0; }
body.staged .page.on { height: 800px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
@keyframes pagein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rail { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 25; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rb { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.rb svg { width: 20px; height: 20px; }
.rb.next { background: var(--ink); border-color: var(--ink); color: #fff; width: 54px; height: 54px; }
.rb:hover:not(:disabled) { border-color: var(--ink); }
.rb.next:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.rb:disabled { opacity: .28; cursor: default; }
.rg { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 7px; border-radius: 14px; }
.rg.main { background: var(--paper); border: 1.5px solid var(--ink); }
.rl { font-size: 10.5px; font-weight: 700; color: var(--ink-3); }
.rg.main .rl { color: var(--ink); }
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dot { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 0; background: none; cursor: pointer; padding: 0; font-size: 12.5px; font-weight: 700; color: var(--ink); display: grid; place-items: center; }
.dot.sm { height: 13px; width: 22px; }
.dot.sm::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--plan); }
.dot:hover { background: var(--plan-wash); } .dot.sm:hover { background: none; } .dot.sm:hover::before { background: var(--ink); }
.dot.on { background: var(--ink); color: #fff; }
.dot.sm.on { background: none; } .dot.sm.on::before { background: var(--accent); width: 10px; height: 10px; }
.dot::after { content: attr(data-label); position: absolute; right: 36px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 2; }
.dot:hover::after, .dot:focus-visible::after { opacity: 1; }
.count { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.3; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; margin-right: 8px; border: 1.5px solid var(--plan); color: var(--ink-2); }
.pill.main { background: var(--ink); border-color: var(--ink); color: #fff; }
.pg-back, .p-back { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pg-back:hover, .p-back:hover { border-color: var(--ink); }
.pg-back svg, .p-back svg { width: 16px; height: 16px; }
.pg-back[hidden] { display: none; }
.r5steps { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 10px; margin: 10px 0 4px; }
.r5steps button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; cursor: pointer; font: inherit; color: var(--ink-2); transition: border-color .3s, background .3s, color .3s; }
.r5steps button b { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.r5steps button b .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--plan-wash); font-size: 12px; }
.r5steps button small { display: block; font-size: 12px; line-height: 1.4; margin-top: 3px; }
.r5steps button.on { border-color: var(--accent); background: var(--accent-wash); }
.r5steps button.on b .num { background: var(--accent); color: #fff; }
.r5steps .r5replay { align-self: stretch; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.r5stage .c-legend { margin: 6px 0 0; }
.r5svg { display: block; width: 100%; height: auto; }
.r5-act { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); opacity: 0; transition: transform .9s var(--ease), opacity .4s; }
.st2 .r5-act.m0, .st2 .r5-act.m1, .st3 .r5-act { transform: scaleY(1); opacity: 1; }
.st2 .r5-act.m1, .st3 .r5-act.m1 { transition-delay: .15s; }
.st3 .r5-act.m3 { transition-delay: .9s; } .st3 .r5-act.m2 { transition-delay: .6s; }
.r5-strike, .r5-s2, .r5-s3 { opacity: 0; transition: opacity .5s .5s; }
.st2 .r5-strike, .st3 .r5-strike, .st2 .r5-s2, .st3 .r5-s2, .st3 .r5-s3 { opacity: 1; }
.st2 .r5-pl, .st3 .r5-pl { opacity: .45; }
.r5-pl { transition: opacity .5s .4s; }
.r5-arc { stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; transition: stroke-dashoffset 1s var(--ease), opacity .15s; }
.r5-head { opacity: 0; transition: opacity .2s; }
.st2 .r5-role, .st3 .r5-role, .st3 .r5-move { stroke-dashoffset: 0; opacity: 1; }
.st2 .r5-role, .st3 .r5-role { transition-delay: .6s; }
.st2 .r5-role-h, .st3 .r5-role-h { opacity: 1; transition-delay: 1.6s; }
.st3 .r5-move.m1 { transition-delay: .35s; }
.st3 .r5-move-h.m0 { opacity: 1; transition-delay: 1s; }
.st3 .r5-move-h.m1 { opacity: 1; transition-delay: 1.35s; }
.r5-rolelab { transition-delay: 1.2s; }
.st3 .r5-role, .st3 .r5-role-h, .st3 .r5-rolelab { opacity: .18; transition-delay: 0s; }
#app > section.page:focus { outline: none; }
.r5-arclab { transition-delay: 1s; }
.r5box { margin-top: 12px; padding: 4px 18px 6px; background: var(--wash); border: 1px solid var(--line); border-radius: 12px; }

.r5evb { border: 1px solid var(--accent); background: var(--paper); color: var(--accent-deep); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }

.r5btn { flex: none; border: 1px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; }
.r5btn:hover { background: var(--ink); color: #fff; }

.r5ev { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.r5ev ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }

.wl-stg { list-style: none; margin: 0 0 6px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }

[data-sum] { cursor: pointer; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }

      '<span class="sp"></span><button type="button" id="ed-up" class="c-el" title="바로 위 요소(블록)를 선택">↑ 상위</button><button type="button" id="ed-mu" class="c-el" title="선택한 블록을 한 칸 위로 (Alt+↑)">▲ 위로</button><button type="button" id="ed-md" class="c-el" title="선택한 블록을 한 칸 아래로 (Alt+↓)">▼ 아래로</button><button type="button" data-w="-80" class="c-w" title="블록 폭 좁게">⇥⇤ 좁게</button><button type="button" data-w="80" class="c-w" title="블록 폭 넓게 (오른쪽 여백까지)">⇤⇥ 넓게</button><button type="button" data-w="0" class="c-w" title="블록 폭 최대 + 오른쪽까지 글자를 채움 — 줄 수를 줄임">폭 최대</button><button type="button" data-w="1" class="c-w" title="줄바꿈 없이 한 줄로 (넘치면 글자를 자동으로 줄임)">한 줄로</button><button type="button" id="ed-rs" class="c-el" title="이 요소의 서식(색·굵기·크기·폭) 수정을 취소">서식 초기화</button><button type="button" id="ed-del" class="c-sh">삭제</button><button type="button" id="ed-undo" title="되돌리기 (Ctrl/⌘+Z)" aria-label="되돌리기"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>' +
      '<span class="sp"></span><button type="button" id="ed-save" class="pri">저장 (git)</button><button type="button" id="ed-tok" title="GitHub 토큰 입력/삭제">토큰</button></div><div class="ed-msg" id="ed-msg" role="status"></div>';
    document.body.appendChild(ui);
    var tg = document.createElement("button");
    tg.type = "button"; tg.id = "ed-toggle"; tg.className = "pg-back"; tg.setAttribute("aria-pressed", "false"); tg.title = "화면 편집 (글자 · 도형 · 색상)"; tg.textContent = "✎ 편집";
    $("fs").parentNode.insertBefore(tg, $("fs"));
    tg.addEventListener("click", function () { setOn(!on); });
    ui.addEventListener("mousedown", function (ev) { if (ev.target.closest("[data-f],[data-z],[data-w]")) ev.preventDefault(); }); /* 서식 버튼은 글자 선택·편집 상태를 유지 */
    ui.addEventListener("click", function (ev) {
      var b = ev.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-t")) { stopEdit(); deselect(); setTool(b.getAttribute("data-t")); }
      else if (b.hasAttribute("data-f")) fmt(b.getAttribute("data-f"));
      else if (b.hasAttribute("data-z")) size(+b.getAttribute("data-z"));
      else if (b.hasAttribute("data-w")) width(+b.getAttribute("data-w"));
      else if (b.id === "ed-save") save();
      else if (b.id === "ed-tok") { askToken(); msg(token() ? "토큰을 저장했습니다." : "토큰을 삭제했습니다."); }
      else if (b.id === "ed-undo") undo();
      else if (b.id === "ed-del") { if (selShape) delShape(); }
      else if (b.id === "ed-mu" || b.id === "ed-md") move(b.id === "ed-mu" ? -1 : 1);
      else if (b.id === "ed-up") { if (sel && sel.parentElement && sel.parentElement.closest("#app > section")) { var u = sel.parentElement; selectEl(u); } }
      else if (b.id === "ed-rs") { if (sel && S.styles[key(sel)]) commit(function () { delete S.styles[key(sel)]; var e = sel; applyAll(); selectEl(e); }); }
      else if (b.id === "ed-nobg") { var s = byId(selShape); if (s) { snap(); s.fill = "none"; renderShapes(); snapped = false; refresh(); } else if (sel) { paint("bg", "transparent"); snapped = false; } }
    });
    ["bg", "fg", "st"].forEach(function (n) {
      var i = $("ed-" + n);
      i.addEventListener("input", function () { paint(n, i.value); });
      i.addEventListener("change", function () { snapped = false; });
    });
    document.addEventListener("compositionend", function () { if (brPending) { brPending = false; setTimeout(function () { if (editing) put("\n"); }, 0); } }, true);
    document.addEventListener("selectionchange", function () { if (on && editing) syncFmt(); });
    window.addEventListener("beforeunload", function (ev) { if (on && sig() !== savedSig) { ev.preventDefault(); ev.returnValue = ""; } });
    window.addEventListener("resize", function () { setTimeout(function () { if (on && !document.body.classList.contains("staged")) setOn(false); }, 250); });

    pages.forEach(layer);
    fetch(FILE, { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
      loadedText = t; if (t) { load(t); applyAll(); }
      savedSig = sig();
    }).catch(function () { savedSig = sig(); });
    savedSig = sig();
  })();
})();
</script>
</body>
</html>
